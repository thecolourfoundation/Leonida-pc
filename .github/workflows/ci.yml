name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make test
  licence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make licence
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make deps
      - run: make submodules
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make secrets
